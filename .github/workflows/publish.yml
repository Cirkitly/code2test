name: Publish to PyPI

# Runs when a GitHub release is published. Uploads with PyPI trusted publishing:
# no token is stored in the repository. One-time setup on pypi.org: add a trusted
# publisher for project "code2test", repository Cirkitly/code2test, workflow
# "publish.yml" and environment "pypi".

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' code2test/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
