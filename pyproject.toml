[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code2test"
dynamic = ["version"]
description = "Intent-first, execution-verified pytest generation for legacy Python code"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Utkarsh Maurya"}
]
keywords = ["testing", "test-generation", "code-analysis", "ai", "llm", "developer-tools", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.0",
    "keyring>=24.0.0",
    "Jinja2>=3.1.6",
    "tree-sitter>=0.23.2",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.21.4",
    "tree-sitter-typescript>=0.21.2",
    "tree-sitter-c>=0.21.4",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-php>=0.23.0",
    "openai>=1.107.0",
    "pydantic>=2.11.7",
    "pydantic-ai>=1.0.6",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.17,<0.18",  # pinned minor: the format check depends on ruff's formatting style
]

[project.scripts]
code2test = "code2test.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Cirkitly/code2test"
Documentation = "https://github.com/Cirkitly/code2test/tree/master/docs"
Repository = "https://github.com/Cirkitly/code2test"
Issues = "https://github.com/Cirkitly/code2test/issues"

[tool.setuptools]
packages = [
    "code2test", 
    "code2test.cli", 
    "code2test.cli.commands", 
    "code2test.cli.models", 
    "code2test.cli.utils", 
    "code2test.core",
    "code2test.core.intent_analyzers",
    "code2test.agents",
    "code2test.storage",
    "code2test.adapters",
    "code2test.adapters.java",
    "code2test.adapters.javascript",
    "code2test.adapters.python",
    "code2test.reporting",
    "code2test.src",
    "code2test.src.be",
    "code2test.src.be.dependency_analyzer",
    "code2test.src.be.dependency_analyzer.analysis",
    "code2test.src.be.dependency_analyzer.analyzers",
    "code2test.src.be.dependency_analyzer.models",
    "code2test.src.be.dependency_analyzer.utils",
]

[tool.setuptools.dynamic]
version = {attr = "code2test.__version__"}

[tool.setuptools.package-data]
code2test = ["templates/**/*", "py.typed"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Errors only (pyflakes and pycodestyle's error classes): an explicit set keeps CI stable across ruff releases
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=code2test --cov-report=term-missing"
