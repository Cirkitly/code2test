# Generate and verify tests for a Python project with Code2Test.
# Copy to .github/workflows/code2test.yml in your project.
# Needs a repository secret with your model provider's API key (here OPENAI_API_KEY);
# see "Choosing a model" in the Code2Test README for other providers.
name: Code2Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODE2TEST_MODEL: openai:gpt-4o-mini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and Code2Test
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install code2test

      - name: Generate tests
        # --exit-code fails the job if any written test file failed verification
        run: code2test test --auto --exit-code --output-dir generated_tests src/

      - name: Run the generated suite
        run: code2test verify generated_tests

      - name: Keep the generated tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: generated_tests/
